name: Flutter Tests

# Nur noch manuell (Actions → Run workflow), um GitHub-Actions-Minuten zu sparen.
# Format, Analyse und Tests laufen lokal vor dem Merge.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"

      - name: Get packages
        run: flutter pub get

      - name: Generate code (Freezed / build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
