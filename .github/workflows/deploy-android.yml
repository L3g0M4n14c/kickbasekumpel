name: Deploy Android (Firebase App Distribution)

# Baut das Release-APK und verteilt es über Firebase App Distribution – nur
# wenn sich Flutter-Code, Android-Projekt, Assets oder Abhängigkeiten geändert
# haben. iOS baut Xcode Cloud (ios/ci_scripts/), Web und Backend haben eigene
# Workflows.
on:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "build.yaml"
      - ".github/workflows/deploy-android.yml"
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release Notes für Tester"
        required: false
        default: "Manuelles Deploy von main branch"

# Schnell hintereinander gemergte Commits: nur der neueste wartende Lauf
# startet, ein laufender Build wird nicht abgebrochen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-distribute:
    name: "Build & Distribute Android"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Generate code (Freezed / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Build APK (Release)
        env:
          ANDROID_KEYSTORE_PATH: keystore.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: flutter build apk --release

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: internal-testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ github.event.inputs.release_notes || 'Automatisches Deploy von main branch' }}

      - name: Cleanup Keystore
        if: always()
        run: rm -f android/app/keystore.jks
