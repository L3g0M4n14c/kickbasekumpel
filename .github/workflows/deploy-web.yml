name: Deploy Web (Firebase Hosting)

# Baut die Flutter-Web-App und deployt sie nach Firebase Hosting – nur wenn
# sich Flutter-Code, Web-Dateien, Assets oder Abhängigkeiten geändert haben.
# Backend (Functions/Regeln) und Android haben eigene Workflows.
on:
  push:
    branches:
      - main
    paths:
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "build.yaml"
      - "firebase.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# Schnell hintereinander gemergte Commits: nur der neueste wartende Lauf
# startet, ein laufender Deploy wird nicht abgebrochen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build und Deploy in einem Job: spart den Artefakt-Umweg und einen
  # zweiten (auf volle Minuten aufgerundeten) Job.
  web:
    name: "Build Flutter Web & Deploy Hosting"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Generate code (Freezed / build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Web
        run: flutter build web --release

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting
        run: firebase deploy --only hosting --project kickbasekumpel --non-interactive --force
